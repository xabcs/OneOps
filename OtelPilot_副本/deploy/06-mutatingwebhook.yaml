# MutatingWebhookConfiguration：caBundle 为空占位，由 bootstrap Job / Controller 写入。
# failurePolicy=Ignore：组件异常时 Pod 创建不受阻塞，保障业务高可用。
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: otel-pilot
  labels:
    app.kubernetes.io/name: otel-pilot
webhooks:
  - name: mpod.otel-pilot.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
    clientConfig:
      service:
        name: otel-pilot
        namespace: otel-pilot
        port: 443
        path: /mutate--v1-pod
      caBundle: ""
    # 排除系统与组件自身命名空间
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease", "otel-pilot"]
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
