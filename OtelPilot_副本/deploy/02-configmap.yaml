# 探针注入统一配置：修改后约 15s 内全副本热生效，无需重启组件。
# 未配置的键回落到组件内置默认值。
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-pilot-config
  namespace: otel-pilot
  labels:
    app.kubernetes.io/name: otel-pilot
data:
  # 探针默认版本（可被 Pod 标签 otel.pilot.agent.version 按应用覆盖）
  agent.version: "2.31.1"
  # 探针下载地址模板，{version} 为版本占位符；私有化环境替换为内部制品库
  agent.download-url: "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v{version}/opentelemetry-javaagent.jar"
  # 拉取探针的 Init 容器镜像（需包含 curl 与 sh）
  init.image: "curlimages/curl:8.11.1"
  # OTLP 上报地址与协议（grpc | http/protobuf）
  exporter.endpoint: "http://otel-collector.observability:4317"
  exporter.protocol: "grpc"
  # 信号导出开关（none 表示关闭）
  traces.exporter: "otlp"
  metrics.exporter: "none"
  logs.exporter: "none"
  # 上下文传播器，默认 W3C Trace Context
  propagators: "tracecontext,baggage"
  # 追加的静态资源属性（k=v 逗号分隔）
  resource.attributes: "k8s.cluster.name=prod-cluster,deployment.environment=production"
