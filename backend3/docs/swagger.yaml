host: localhost:8082
info:
  contact: {}
  description: |-
    OneOps 一体化运维平台后端 API
    包含系统管理、CMDB、K8s、审计、监控、应用授权等模块
  title: OneOps API
  version: "1.0"
paths:
  /audit/login-logs:
    get:
      description: 分页获取登录日志，支持按用户名、状态、位置、时间范围筛选
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 用户名
        in: query
        name: username
        type: string
      - description: 状态(success/failed)
        in: query
        name: status
        type: string
      - description: 登录位置
        in: query
        name: location
        type: string
      - description: 起始时间
        in: query
        name: startTime
        type: string
      - description: 结束时间
        in: query
        name: endTime
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取登录日志失败
          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 获取登录日志
      tags:
      - 审计日志
  /audit/login-logs/export:
    get:
      description: 按筛选条件导出登录日志为 CSV 文件下载
      parameters:
      - description: 用户名
        in: query
        name: username
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      - description: 起始时间
        in: query
        name: startTime
        type: string
      - description: 结束时间
        in: query
        name: endTime
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: 导出登录日志失败
          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 导出登录日志
      tags:
      - 审计日志
  /audit/modules:
    get:
      description: 返回操作日志筛选可用的业务模块列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 获取审计模块列表
      tags:
      - 审计日志
  /audit/operation-logs:
    get:
      description: 分页获取操作日志，支持按用户名、模块、状态、动作、HTTP 方法、路径、耗时区间、时间范围筛选
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 用户名
        in: query
        name: username
        type: string
      - description: 模块
        in: query
        name: module
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      - description: 操作动作
        in: query
        name: action
        type: string
      - description: HTTP 方法
        in: query
        name: method
        type: string
      - description: 状态码
        in: query
        name: statusCode
        type: string
      - description: 请求路径
        in: query
        name: path
        type: string
      - description: 耗时区间
        in: query
        name: durationRange
        type: string
      - description: 起始时间
        in: query
        name: startTime
        type: string
      - description: 结束时间
        in: query
        name: endTime
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取操作日志失败
          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 获取操作日志
      tags:
      - 审计日志
  /audit/operation-logs/export:
    get:
      description: 按筛选条件导出操作日志为 CSV 文件下载
      parameters:
      - description: 用户名
        in: query
        name: username
        type: string
      - description: 模块
        in: query
        name: module
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      - description: 起始时间
        in: query
        name: startTime
        type: string
      - description: 结束时间
        in: query
        name: endTime
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: 导出操作日志失败
          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 导出操作日志
      tags:
      - 审计日志
  /audit/stats:
    get:
      description: 返回审计模块的汇总统计信息（登录/操作/事件计数等）
      produces:
      - application/json
      responses:
        "200":
          description: 获取审计统计信息失败
          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 获取审计统计
      tags:
      - 审计日志
  /audit/system-event-logs:
    get:
      description: 分页获取系统事件日志，支持按级别、来源、分类、时间范围筛选
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 日志级别
        in: query
        name: level
        type: string
      - description: 来源
        in: query
        name: source
        type: string
      - description: 分类
        in: query
        name: category
        type: string
      - description: 起始时间
        in: query
        name: startTime
        type: string
      - description: 结束时间
        in: query
        name: endTime
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取系统事件日志失败
          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 获取系统事件日志
      tags:
      - 审计日志
  /cmdb/access-policies:
    get:
      description: 分页获取访问策略列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 请求参数错误 / 获取访问策略列表失败
          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 获取访问策略列表
      tags:
      - CMDB-堡垒机
    post:
      consumes:
      - application/json
      description: 创建一个新的访问策略
      parameters:
      - description: 访问策略信息
        in: body
        name: policy
        required: true
        schema:
          $ref: '#/definitions/oneops_backend3_model_cmdb.AssetAccessPolicy'
      produces:
      - application/json
      responses:
        "200":
          description: 请求参数错误 / 创建失败
          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 创建访问策略
      tags:
      - CMDB-堡垒机
  /cmdb/access-policies/{id}:
    delete:
      description: 根据策略 ID 删除访问策略
      parameters:
      - description: 策略 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 无效的策略 ID / 删除失败
          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 删除访问策略
      tags:
      - CMDB-堡垒机
    get:
      description: 根据策略 ID 获取访问策略详情
      parameters:
      - description: 策略 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 无效的策略 ID / 策略不存在
          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 获取访问策略详情
      tags:
      - CMDB-堡垒机
    put:
      consumes:
      - application/json
      description: 根据策略 ID 更新访问策略信息（部分字段更新）
      parameters:
      - description: 策略 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 需要更新的字段
        in: body
        name: policy
        required: true
        schema:
          $ref: '#/definitions/oneops_backend3_model_cmdb.AssetAccessPolicy'
      produces:
      - application/json
      responses:
        "200":
          description: 无效的策略 ID / 请求参数错误 / 更新失败
          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 更新访问策略
      tags:
      - CMDB-堡垒机
  /cmdb/agent-upgrade-tasks:
