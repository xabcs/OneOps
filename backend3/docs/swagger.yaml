          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 获取升级任务列表
      tags:
      - CMDB-Agent
  /cmdb/agent-upgrade-tasks/{id}:
    get:
      description: 根据任务 ID 获取 Agent 升级任务详情
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 无效的任务 ID / 获取失败
          schema:
            $ref: '#/definitions/oneops_backend3_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: 获取升级任务详情
      tags:
      - CMDB-Agent
  /cmdb/agent-versions:
    get:
      description: 获取所有 Agent 版本列表
      produces:
