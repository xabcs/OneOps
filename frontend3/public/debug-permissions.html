<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>权限管理诊断工具</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f5f5f5;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #333;
        border-bottom: 2px solid #409eff;
        padding-bottom: 10px;
      }
      .section {
        margin: 20px 0;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 4px;
      }
      .section h3 {
        margin-top: 0;
        color: #409eff;
      }
      .status {
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .status.warning {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeaa7;
      }
      button {
        background: #409eff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        margin: 5px;
      }
      button:hover {
        background: #66b1ff;
      }
      pre {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 4px;
        overflow-x: auto;
        font-size: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 10px 0;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background: #409eff;
        color: white;
      }
      tr:nth-child(even) {
        background: #f8f9fa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔍 权限管理系统诊断工具</h1>

      <!-- 第一步：检查认证 -->
      <div class="section">
        <h3>第一步：检查认证状态</h3>
        <div id="authStatus"></div>
        <button onclick="checkAuth()">检查认证状态</button>
      </div>

      <!-- 第二步：测试后端连接 -->
      <div class="section">
        <h3>第二步：测试后端连接</h3>
        <button onclick="testBackend()">测试后端连接</button>
        <div id="backendStatus"></div>
      </div>

      <!-- 第三步：获取权限列表 -->
      <div class="section">
        <h3>第三步：获取权限列表</h3>
        <button onclick="fetchPermissions()">获取权限列表</button>
        <div id="permissionsStatus"></div>
        <div id="permissionsData"></div>
      </div>

      <!-- 第四步：数据格式检查 -->
      <div class="section">
        <h3>第四步：数据格式检查</h3>
        <div id="formatCheck"></div>
      </div>

      <!-- 原始响应 -->
      <div class="section">
        <h3>原始响应数据</h3>
        <pre id="rawResponse">等待请求...</pre>
      </div>
    </div>

    <script>
      const API_BASE = window.location.origin;
      let token = null;

      // 检查认证状态
      function checkAuth() {
        token = localStorage.getItem('oneops_token');
        const userInfo = localStorage.getItem('oneops_userInfo');
        const statusDiv = document.getElementById('authStatus');

        if (!token) {
          statusDiv.innerHTML = '<div class="status error">❌ 未找到Token，请先登录系统</div>';
          return false;
        }

        let user = null;
        try {
          user = userInfo ? JSON.parse(userInfo) : null;
        } catch (e) {
          console.error('解析用户信息失败:', e);
        }

        statusDiv.innerHTML = `
                <div class="status success">✅ 已找到Token</div>
                <p><strong>Token:</strong> ${token.substring(0, 20)}...</p>
                <p><strong>用户:</strong> ${user?.username || '未知'}</p>
                <p><strong>角色:</strong> ${user?.roleIds?.join(', ') || '无'}</p>
            `;
        return true;
      }

      // 测试后端连接
      async function testBackend() {
        const statusDiv = document.getElementById('backendStatus');
        statusDiv.innerHTML = '<div class="status warning">⏳ 正在测试连接...</div>';

        try {
          const response = await fetch(`${API_BASE}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: 'test' })
          });

          const data = await response.json();
          statusDiv.innerHTML = `
                    <div class="status success">✅ 后端连接正常</div>
                    <p><strong>状态码:</strong> ${response.status}</p>
                    <p><strong>响应:</strong> ${JSON.stringify(data)}</p>
                `;
        } catch (error) {
          statusDiv.innerHTML = `
                    <div class="status error">❌ 后端连接失败</div>
                    <p><strong>错误:</strong> ${error.message}</p>
                `;
        }
      }

      // 获取权限列表
      async function fetchPermissions() {
        if (!token && !checkAuth()) {
          return;
        }

        const statusDiv = document.getElementById('permissionsStatus');
        const dataDiv = document.getElementById('permissionsData');
        const rawDiv = document.getElementById('rawResponse');

        statusDiv.innerHTML = '<div class="status warning">⏳ 正在获取权限列表...</div>';

        try {
          const response = await fetch(`${API_BASE}/api/system/permissions?current=1&size=10`, {
            headers: {
              Authorization: `Bearer ${token}`
            }
          });

          const data = await response.json();
          rawDiv.textContent = JSON.stringify(data, null, 2);

          if (data.code === 401) {
            statusDiv.innerHTML = `
                        <div class="status error">❌ 认证失败</div>
                        <p>${data.message}</p>
                        <p><strong>建议:</strong> 请重新登录系统</p>
                    `;
            return;
          }

          if (data.code !== 200 && data.code !== undefined) {
            statusDiv.innerHTML = `
                        <div class="status error">❌ 请求失败</div>
                        <p><strong>错误码:</strong> ${data.code}</p>
                        <p><strong>错误信息:</strong> ${data.message}</p>
                    `;
            return;
          }

          const records = data.data?.records || [];
          statusDiv.innerHTML = `
                    <div class="status success">✅ 数据获取成功</div>
                    <p><strong>总记录数:</strong> ${data.data?.total || 0}</p>
                    <p><strong>当前页:</strong> ${data.data?.current || 1}</p>
                    <p><strong>每页大小:</strong> ${data.data?.size || 10}</p>
                    <p><strong>返回记录:</strong> ${records.length}</p>
                `;

          // 显示权限数据表格
          if (records.length > 0) {
            dataDiv.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>名称</th>
                                    <th>编码</th>
                                    <th>模块</th>
                                    <th>资源</th>
                                    <th>操作</th>
                                    <th>级别</th>
                                    <th>状态</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${records
                                  .map(
                                    p => `
                                    <tr>
                                        <td>${p.id}</td>
                                        <td>${p.name}</td>
                                        <td>${p.code}</td>
                                        <td>${p.module}</td>
                                        <td>${p.resource}</td>
                                        <td>${p.action}</td>
                                        <td>${p.level} (${getLevelText(p.level)})</td>
                                        <td>${p.status === 1 ? '启用' : '禁用'}</td>
                                    </tr>
                                `
                                  )
                                  .join('')}
                            </tbody>
                        </table>
                    `;

            // 检查数据格式
            checkDataFormat(records);
          } else {
            dataDiv.innerHTML = '<div class="status warning">⚠️ 没有找到权限数据</div>';
          }
        } catch (error) {
          statusDiv.innerHTML = `
                    <div class="status error">❌ 请求失败</div>
                    <p><strong>错误:</strong> ${error.message}</p>
                `;
          rawDiv.textContent = error.stack;
        }
      }

      // 检查数据格式
      function checkDataFormat(records) {
        const checkDiv = document.getElementById('formatCheck');
        const issues = [];

        if (records.length === 0) {
          issues.push('没有数据记录');
        }

        const firstRecord = records[0];
        if (firstRecord) {
          // 检查必要字段
          if (!firstRecord.id) issues.push('缺少 id 字段');
          if (!firstRecord.name) issues.push('缺少 name 字段');
          if (!firstRecord.code) issues.push('缺少 code 字段');
          if (!firstRecord.module) issues.push('缺少 module 字段');

          // 检查level字段类型
          if (typeof firstRecord.level === 'string') {
            issues.push(`⚠️ level 字段是字符串类型 "${firstRecord.level}"，前端可能期望数字类型`);
          } else if (typeof firstRecord.level === 'number') {
            issues.push(`✅ level 字段是数字类型 ${firstRecord.level}`);
          }

          // 检查status字段
          if (typeof firstRecord.status !== 'number') {
            issues.push(`⚠️ status 字段类型异常: ${typeof firstRecord.status}`);
          }
        }

        if (issues.length === 0) {
          checkDiv.innerHTML = '<div class="status success">✅ 数据格式检查通过</div>';
        } else {
          checkDiv.innerHTML = `
                    <div class="status ${issues.some(i => i.includes('✅')) ? 'success' : 'error'}">
                        数据格式检查结果：
                        <ul>
                            ${issues.map(i => `<li>${i}</li>`).join('')}
                        </ul>
                    </div>
                `;
        }
      }

      // 获取级别文本
      function getLevelText(level) {
        const map = {
          1: '模块级',
          2: '页面级',
          3: '按钮级',
          4: 'API级'
        };
        return map[level] || '未知';
      }

      // 页面加载时自动检查
      window.addEventListener('load', () => {
        checkAuth();
      });
    </script>
  </body>
</html>
